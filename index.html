<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Link Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            text: '#1d1d1f',
                            textMuted: '#86868b',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f5f5f7;
            /* Subtler, cleaner background gradient */
            background-image: 
                radial-gradient(at 0% 0%, hsla(220, 20%, 95%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(210, 40%, 95%, 1) 0, transparent 50%);
            background-attachment: fixed;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Clean, uniform frosted glass */
        .bento-box {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px; 
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .bento-box:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.65);
        }

        /* Simplified link items */
        .doc-link {
            transition: all 0.2s ease;
            border-radius: 10px;
        }
        .doc-link:hover {
            background-color: rgba(0, 0, 0, 0.03);
            transform: translateX(3px);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        /* Clean inputs for edit mode */
        .edit-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px dashed rgba(0, 0, 0, 0.1);
            border-radius: 6px;
            padding: 4px 8px;
            transition: all 0.2s;
            color: inherit;
            font-family: inherit;
            width: 100%;
        }
        .edit-input:focus {
            background: #fff;
            border-color: rgba(0, 122, 255, 0.4);
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.1);
        }
        
        .loader {
            border: 2px solid rgba(0,0,0,0.1);
            border-bottom-color: #1d1d1f;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12">

    <div id="app-root">
        <div class="h-[60vh] flex flex-col items-center justify-center gap-4 text-apple-textMuted">
            <span class="loader w-6 h-6"></span>
            <p class="text-sm font-medium">Loading directory...</p>
        </div>
    </div>

    <footer class="max-w-5xl mx-auto mt-16 mb-6 text-center text-xs text-apple-textMuted flex flex-col items-center gap-2">
        <p>Digital Strategy Links &copy; 2026</p>
    </footer>

    <script>
        // ============================================================================
        // 1. PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
        // ============================================================================
        const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbxAkL8b4OSYbyv3n9OHCykXOQU1Kg-uh2h-TIaxm0BST8xjDK0UBqJmcflkg6_DOqo6/exec"; 

        // Simplified, uniform data structure
        const defaultData = {
            header: {
                title: "Strategy Links",
                subtitle: "Master directory for all digital strategy working documents"
            },
            cards: [
                {
                    id: 'substack', type: 'list', title: 'Substack Docs', emoji: '✍️',
                    items: [
                        { id: 's1', name: 'Q3 Strategy Recap', url: '#', icon: 'fa-solid fa-file-word text-blue-500' },
                        { id: 's2', name: 'Product Launch Series', url: '#', icon: 'fa-solid fa-file-word text-blue-500' },
                    ]
                },
                {
                    id: 'scripts', type: 'list', title: 'Video Scripts', emoji: '🎬',
                    items: [
                        { id: 'r1', name: 'TikTok Hook Ideas', url: '#', icon: 'fa-solid fa-file-excel text-green-600' },
                        { id: 'r2', name: 'Behind the Scenes Script', url: '#', icon: 'fa-solid fa-file-word text-blue-500' }
                    ]
                },
                {
                    id: 'captions', type: 'list', title: 'Social Planners', emoji: '📱',
                    items: [
                        { id: 'cap1', name: 'September Content Calendar', url: '#', icon: 'fa-regular fa-calendar text-red-500' },
                        { id: 'cap2', name: 'LinkedIn Drafts', url: '#', icon: 'fa-solid fa-file-word text-blue-500' }
                    ]
                },
                {
                    id: 'canva', type: 'list', title: 'Design Files', emoji: '🎨',
                    items: [
                        { id: 'c1', name: 'Q3 Brand Assets Folder', url: '#', icon: 'fa-solid fa-palette text-purple-500' },
                        { id: 'c2', name: 'IG Carousel Templates', url: '#', icon: 'fa-solid fa-palette text-purple-500' },
                    ]
                },
                {
                    id: 'assets', type: 'list', title: 'Media & Drives', emoji: '🔗',
                    items: [
                        { id: 'a1', name: 'Q3 Brand Photoshoot (G-Drive)', url: '#', icon: 'fa-brands fa-google-drive text-green-500' },
                        { id: 'a2', name: 'Raw B-Roll Footage (Dropbox)', url: '#', icon: 'fa-brands fa-dropbox text-blue-500' },
                        { id: 'a3', name: 'Website Assets (Figma)', url: '#', icon: 'fa-brands fa-figma text-pink-500' }
                    ]
                }
            ]
        };

        let appData = JSON.parse(JSON.stringify(defaultData));
        let isEditMode = false;

        async function loadData() {
            if (!GOOGLE_SHEETS_API_URL) {
                const localData = localStorage.getItem('minimalLinkHubData');
                if (localData) appData = JSON.parse(localData);
                render();
                return;
            }

            try {
                const response = await fetch(GOOGLE_SHEETS_API_URL);
                const data = await response.json();
                if (data && data.header && data.cards) appData = data;
                render();
            } catch (error) {
                console.error("Error loading from Google Sheets:", error);
                render(); 
            }
        }

        async function saveData() {
            const saveStatusUi = document.getElementById('cloud-save-status');
            if (saveStatusUi) saveStatusUi.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-gray-400"></i>';

            if (!GOOGLE_SHEETS_API_URL) {
                localStorage.setItem('minimalLinkHubData', JSON.stringify(appData));
                setTimeout(() => { if (saveStatusUi) saveStatusUi.innerHTML = ''; }, 1000);
                return;
            }
            
            try {
                await fetch(GOOGLE_SHEETS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(appData)
                });
                if (saveStatusUi) saveStatusUi.innerHTML = '';
            } catch (e) {
                console.error("Error saving data:", e);
                if (saveStatusUi) saveStatusUi.innerHTML = '<i class="fa-solid fa-circle-exclamation text-red-400"></i>';
            }
        }

        function escapeHtml(unsafe) {
            if (!unsafe && unsafe !== 0) return '';
            return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function renderHeader() {
            const h = appData.header;
            return `
                <header class="max-w-5xl mx-auto mb-10 pt-6 flex flex-col md:flex-row md:justify-between md:items-start gap-4">
                    <div class="flex-1 w-full text-left">
                        ${isEditMode 
                            ? `<input class="edit-input text-3xl font-bold tracking-tight text-apple-text mb-1 block" value="${escapeHtml(h.title)}" data-action="update-header-title">
                               <input class="edit-input text-sm text-apple-textMuted block" value="${escapeHtml(h.subtitle)}" data-action="update-header-subtitle">`
                            : `<h1 class="text-3xl font-bold tracking-tight text-apple-text">${escapeHtml(h.title)}</h1>
                               <p class="text-sm text-apple-textMuted mt-1">${escapeHtml(h.subtitle)}</p>`
                        }
                    </div>
                    <div class="flex items-center gap-3">
                        <div id="cloud-save-status" class="text-xs"></div>
                        <button data-action="toggle-edit" class="text-sm font-medium transition-colors px-3 py-1.5 rounded-lg flex items-center gap-1.5 ${isEditMode ? 'bg-black text-white hover:bg-gray-800' : 'text-gray-400 hover:text-gray-800 hover:bg-black/5'}" title="Edit Directory">
                            <i class="${isEditMode ? 'fa-solid fa-check' : 'fa-solid fa-sliders'}"></i>
                            ${isEditMode ? 'Save' : '<span class="hidden sm:inline">Edit</span>'}
                        </button>
                    </div>
                </header>
            `;
        }

        function renderListCard(card) {
            return card.items.map(item => {
                if (isEditMode) {
                    return `
                        <div class="flex flex-col gap-1 p-2 bg-white/50 rounded-lg mb-2 relative">
                            <div class="flex items-center gap-2">
                                <i class="${item.icon} w-5 text-center text-sm opacity-50"></i>
                                <input class="edit-input flex-1 text-sm font-medium" value="${escapeHtml(item.name)}" placeholder="Item Name" data-action="update-list-name" data-card-id="${card.id}" data-item-id="${item.id}">
                                <button data-action="delete-list-item" data-card-id="${card.id}" data-item-id="${item.id}" class="text-red-400 hover:text-red-600 w-6 h-6 flex items-center justify-center" title="Delete">
                                    <i class="fa-solid fa-xmark text-xs"></i>
                                </button>
                            </div>
                            <div class="flex items-center gap-2 pl-7">
                                <input class="edit-input flex-1 text-xs text-gray-500" value="${escapeHtml(item.url)}" placeholder="https://..." data-action="update-list-url" data-card-id="${card.id}" data-item-id="${item.id}">
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <a href="${item.url}" class="doc-link flex items-center py-2.5 px-2 text-sm font-medium text-apple-text" target="_blank" rel="noopener noreferrer">
                            <i class="${item.icon} w-5 text-center mr-2 opacity-80"></i>
                            ${escapeHtml(item.name)}
                        </a>
                    `;
                }
            }).join('');
        }

        function renderMainGrid() {
            const cardsHtml = appData.cards.map(card => `
                <div class="bento-box p-5 flex flex-col">
                    <div class="flex items-center gap-2 mb-4">
                        ${isEditMode 
                            ? `<input class="edit-input text-center w-8 p-1 bg-transparent" value="${escapeHtml(card.emoji)}" data-action="update-card-emoji" data-card-id="${card.id}">
                               <input type="text" class="edit-input font-semibold text-lg flex-1" data-action="update-card-title" data-card-id="${card.id}" value="${escapeHtml(card.title)}">`
                            : `<span class="text-xl">${escapeHtml(card.emoji)}</span>
                               <h2 class="text-base font-semibold truncate text-apple-text">${escapeHtml(card.title)}</h2>`
                        }
                    </div>
                    
                    <div class="flex-1 flex flex-col gap-0.5">
                        ${renderListCard(card)}
                    </div>
                    
                    ${isEditMode ? `
                        <button data-action="add-card-item" data-card-id="${card.id}" class="mt-3 w-full py-1.5 bg-black/5 hover:bg-black/10 rounded-lg text-xs font-medium transition-colors text-gray-500 flex items-center justify-center gap-1">
                            <i class="fa-solid fa-plus text-[10px]"></i> Add Link
                        </button>
                    ` : ''}
                </div>
            `).join('');

            return `
                <main class="max-w-5xl mx-auto">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 auto-rows-max">
                        ${cardsHtml}
                    </div>
                </main>
            `;
        }

        function render() {
            const root = document.getElementById('app-root');
            root.innerHTML = renderHeader() + renderMainGrid();
        }

        document.addEventListener('input', (e) => {
            if (!e.target.matches('.edit-input')) return;
            
            const action = e.target.getAttribute('data-action');
            const cardId = e.target.getAttribute('data-card-id');
            const itemId = e.target.getAttribute('data-item-id');
            const val = e.target.value;

            if (action === 'update-header-title') appData.header.title = val;
            if (action === 'update-header-subtitle') appData.header.subtitle = val;

            const card = appData.cards.find(c => c.id === cardId);
            if (!card) return;

            if (action === 'update-card-title') card.title = val;
            if (action === 'update-card-emoji') card.emoji = val;
            
            if (itemId) {
                const item = card.items.find(i => i.id === itemId);
                if (item) {
                    if (action === 'update-list-name') item.name = val;
                    if (action === 'update-list-url') item.url = val;
                }
            }
        });

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            
            const action = btn.getAttribute('data-action');
            const cardId = btn.getAttribute('data-card-id');
            const itemId = btn.getAttribute('data-item-id');

            if (action === 'toggle-edit') {
                isEditMode = !isEditMode;
                if (!isEditMode) saveData();
                render();
                return;
            }

            const card = appData.cards.find(c => c.id === cardId);
            if (!card) return;

            if (action === 'add-card-item') {
                card.items.push({ id: generateId(), name: 'New Resource', url: '#', icon: 'fa-solid fa-link text-gray-400' });
                render();
            }

            if (action === 'delete-list-item') {
                card.items = card.items.filter(i => i.id !== itemId);
                render();
            }
        });

        // Start App
        loadData();

    </script>
</body>
</html>
